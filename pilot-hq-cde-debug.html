<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zona Zero — DEBUG Núcleo C/D/E + viewport móvil</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#0e0b06; font-family:'Segoe UI',system-ui,sans-serif; }
#layout {
  position:fixed; inset:0; bottom:52px;
  display:grid; grid-template-columns: 1fr 390px; gap:0;
}
@media (max-width: 900px) {
  #layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #mobile-col { max-height: 45vh; }
}
#map-pane {
  position:relative; overflow:hidden; background:#0e0b06; cursor:grab; touch-action:none;
}
#map-pane.grabbing { cursor:grabbing; }
#world {
  position:absolute; width:1819px; height:865px;
  transform-origin:0 0; will-change:transform;
}
#map-img, #overlay {
  position:absolute; inset:0; width:1819px; height:865px; pointer-events:none;
}
#mobile-col {
  background:#12100c; border-left:1px solid rgba(255,255,255,.12);
  display:flex; flex-direction:column; overflow:auto; padding:8px;
  gap:8px;
}
#mobile-col h3 {
  color:#ffd87a; font:700 12px 'Segoe UI',sans-serif;
}
.phone {
  border:2px solid rgba(255,255,255,.25); border-radius:14px;
  width:100%; max-width:360px; margin:0 auto;
  aspect-ratio: 390 / 844;
  position:relative; overflow:hidden; background:#0e0b06;
  box-shadow:0 0 0 1px rgba(0,0,0,.5);
}
.phone-label {
  position:absolute; top:6px; left:8px; right:8px; z-index:5;
  color:#fff; font:700 11px 'Segoe UI',sans-serif;
  text-shadow:0 0 4px #000, 0 1px 2px #000;
  pointer-events:none;
}
.phone-meta {
  position:absolute; bottom:6px; left:8px; right:8px; z-index:5;
  color:#e8ddb0; font:10px/1.35 Consolas,monospace;
  text-shadow:0 0 4px #000; pointer-events:none;
  background:rgba(0,0,0,.45); border-radius:6px; padding:4px 6px;
}
.phone-canvas {
  position:absolute; inset:0; width:100%; height:100%;
  transform-origin:0 0;
}
.phone.active { outline:2px solid #ffd87a; }
#hud {
  position:fixed; top:0; left:0; right:0; z-index:200;
  padding:5px 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  background:rgba(0,0,0,.85); color:#f5e9c0; font-size:12px; pointer-events:none;
}
#panel {
  position:absolute; left:8px; top:40px; z-index:50;
  background:rgba(0,0,0,.9); border:1px solid rgba(255,255,255,.14);
  border-radius:10px; padding:8px 10px; color:#e8ddb0;
  font:11px/1.4 Consolas,monospace; max-width:250px; pointer-events:all;
}
#panel .cand { border:1px solid rgba(255,255,255,.1); border-radius:7px; padding:6px; margin:5px 0; cursor:pointer; }
#panel .cand:hover { background:rgba(255,255,255,.06); }
#panel .cand.active { outline:2px solid #ffd87a; }
#panel .c .t { color:#ffc86a; font-weight:700; }
#panel .d .t { color:#7ec8ff; font-weight:700; }
#panel .e .t { color:#9dff9d; font-weight:700; }
#toolbar {
  position:fixed; left:0; right:0; bottom:0; z-index:300;
  display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  padding:6px 8px; background:rgba(8,6,4,.94); border-top:1px solid rgba(255,255,255,.12);
}
#toolbar button {
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
  color:#f5e9c0; border-radius:6px; padding:6px 9px; font-size:11px; font-weight:600; cursor:pointer;
}
#toolbar button.on { outline:2px solid #ffd87a; background:rgba(255,216,122,.18); }
.note { opacity:.65; font-size:9px; margin-top:4px; line-height:1.3; }
</style>
</head>
<body>

<div id="hud">
  <strong>DEBUG · Núcleo C / D / E + viewport móvil 390×844</strong>
  <span>SOLO visual · JSON zonas intacto · sin gameplay</span>
  <span id="hud-cam"></span>
</div>

<div id="layout">
  <div id="map-pane">
    <div id="panel">
      <div style="color:#ffd87a;font-weight:700;margin-bottom:4px">Candidatos</div>
      <div id="cand-list"></div>
      <div class="note">Footprint HQ 5×4 = 120×96 px (@ cellPx terreno 24) solo para posición. Zoom móvil propuesto: ver panel derecho.</div>
    </div>
    <div id="world">
      <img id="map-img" src="assets/art/terrain/mapa-neni-1819x865-brownmatch-up2x.png" width="1819" height="865" alt="">
      <svg id="overlay" viewBox="0 0 1819 865" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div id="mobile-col">
    <h3>Viewport móvil portrait 390×844</h3>
    <div id="phones"></div>
  </div>
</div>

<div id="toolbar">
  <button type="button" class="on" id="btn-zones">Zonas</button>
  <button type="button" class="on" id="btn-halos">Halos</button>
  <button type="button" class="on" id="btn-fps">Footprints</button>
  <button type="button" class="on" id="btn-labels">Etiquetas</button>
  <button type="button" id="btn-fit">Fit mapa</button>
  <button type="button" id="btn-c">Focus C</button>
  <button type="button" id="btn-d">Focus D</button>
  <button type="button" id="btn-e">Focus E</button>
</div>

<script>
const ZONES_URL = 'content/pilot/neni-pilot-zones-v3.json';
const CAND_URL = 'content/pilot/hq-nucleus-candidates-v2-cde.json';
const WORLD_W = 1819, WORLD_H = 865, ZOOM_MAX = 3;

const COLORS = {
  C: { stroke: '#ffb84a', fill: 'rgba(255,170,60,0.22)', mark: '#ffc86a' },
  D: { stroke: '#5eb0ff', fill: 'rgba(80,160,255,0.22)', mark: '#7ec8ff' },
  E: { stroke: '#5fdc5f', fill: 'rgba(60,200,80,0.22)', mark: '#9dff9d' },
};

let zones = null, data = null;
let cam = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 1 };
let showZones = true, showHalos = true, showFps = true, showLabels = true;
let focusId = null;

const mapPane = document.getElementById('map-pane');
const world = document.getElementById('world');
const overlay = document.getElementById('overlay');

function zoomMin() {
  return Math.max(mapPane.clientWidth / WORLD_W, mapPane.clientHeight / WORLD_H);
}
function applyCamera() {
  const vw = mapPane.clientWidth, vh = mapPane.clientHeight;
  cam.zoom = Math.max(zoomMin(), Math.min(ZOOM_MAX, cam.zoom));
  const halfW = vw / 2 / cam.zoom, halfH = vh / 2 / cam.zoom;
  if (vw / cam.zoom >= WORLD_W) cam.x = WORLD_W / 2;
  else cam.x = Math.max(halfW, Math.min(WORLD_W - halfW, cam.x));
  if (vh / cam.zoom >= WORLD_H) cam.y = WORLD_H / 2;
  else cam.y = Math.max(halfH, Math.min(WORLD_H - halfH, cam.y));
  world.style.transform = `scale(${cam.zoom}) translate(${-(cam.x - halfW)}px,${-(cam.y - halfH)}px)`;
  document.getElementById('hud-cam').textContent =
    `mapa z=${cam.zoom.toFixed(2)} · (${Math.round(cam.x)},${Math.round(cam.y)})`;
}
function fitWorld() {
  cam.zoom = zoomMin(); cam.x = WORLD_W / 2; cam.y = WORLD_H / 2; applyCamera();
}
function focusOn(wx, wy, z = 1.2) {
  cam.x = wx; cam.y = wy; cam.zoom = Math.max(zoomMin(), z); applyCamera();
}

function parseKey(k) { const [cx, cy] = k.split(',').map(Number); return { cx, cy }; }
function cellRect(cx, cy, g) {
  const [ox, oy] = g.origin; const cell = g.cellPx;
  return { x: ox + cx * cell, y: oy + cy * cell, w: cell, h: cell };
}
function isBuildable(cx, cy) {
  const v = zones.overrides?.[`${cx},${cy}`];
  return !v || v === 'buildable';
}

function renderPanel() {
  const list = document.getElementById('cand-list');
  const ids = ['C', 'D', 'E'];
  list.innerHTML = ids.map((id) => {
    const c = data.candidates[id];
    if (!c) return '';
    const mv = c.mobileViewport;
    return `<div class="cand ${id.toLowerCase()} ${focusId === id ? 'active' : ''}" data-id="${id}">
      <div class="t">${id} · (${c.world.join(', ')})</div>
      <div>ΔC: (${c.deltaFromC.join(', ')})</div>
      <div>buildable r6: ${c.aroundR6Buildable}/${c.aroundR6Total}</div>
      <div>exp N${c.dirs.N} E${c.dirs.E} S${c.dirs.S} W${c.dirs.W}</div>
      <div>móvil ↑${mv.worldAbovePx}px ↓${mv.worldBelowPx}px @z${mv.zoom}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.cand').forEach((el) => {
    el.addEventListener('click', () => {
      focusId = el.dataset.id;
      const c = data.candidates[focusId];
      focusOn(c.world[0], c.world[1], 1.25);
      renderPanel();
      renderMap();
      renderPhones();
    });
  });
}

function drawCand(c, id) {
  if (!c) return;
  const g = zones.grid;
  const col = COLORS[id];
  const [wx, wy] = c.world;
  const cell = g.cellPx;
  const fw = 5, fh = 4;

  if (showHalos && c.cell) {
    const [ccx, ccy] = c.cell;
    const ax = ccx - 2, ay = ccy - 2;
    for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) {
      const x = ccx + dx, y = ccy + dy;
      if (x >= ax && x < ax + fw && y >= ay && y < ay + fh) continue;
      if (!isBuildable(x, y)) continue;
      const r = cellRect(x, y, g);
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', r.x + 0.5); rect.setAttribute('y', r.y + 0.5);
      rect.setAttribute('width', r.w - 1); rect.setAttribute('height', r.h - 1);
      rect.setAttribute('fill', col.fill);
      overlay.appendChild(rect);
    }
  }

  if (showFps && c.cell) {
    const [ccx, ccy] = c.cell;
    const ax = ccx - 2, ay = ccy - 2;
    const r = cellRect(ax, ay, g);
    const fp = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    fp.setAttribute('x', r.x); fp.setAttribute('y', r.y);
    fp.setAttribute('width', fw * cell); fp.setAttribute('height', fh * cell);
    fp.setAttribute('fill', col.fill);
    fp.setAttribute('stroke', col.stroke);
    fp.setAttribute('stroke-width', focusId === id ? 3 : 2);
    fp.setAttribute('stroke-dasharray', '6 3');
    overlay.appendChild(fp);
  }

  const mark = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  mark.setAttribute('cx', wx); mark.setAttribute('cy', wy); mark.setAttribute('r', 7);
  mark.setAttribute('fill', col.mark); mark.setAttribute('stroke', '#fff'); mark.setAttribute('stroke-width', '2');
  overlay.appendChild(mark);

  if (showLabels) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', wx); t.setAttribute('y', wy - 14);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', col.mark);
    t.setAttribute('font-size', '13'); t.setAttribute('font-weight', '700');
    t.setAttribute('font-family', 'Segoe UI,sans-serif');
    t.setAttribute('stroke', '#000'); t.setAttribute('stroke-width', '3'); t.setAttribute('paint-order', 'stroke');
    t.textContent = `${id} (${wx},${wy})`;
    overlay.appendChild(t);
  }
}

function renderMap() {
  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
  if (!zones || !data) return;
  const g = zones.grid;
  if (showZones) {
    Object.entries(zones.overrides || {}).forEach(([k, sem]) => {
      const { cx, cy } = parseKey(k);
      const r = cellRect(cx, cy, g);
      const fill = sem === 'blocked' ? 'rgba(200,70,50,0.28)'
        : sem === 'forest' ? 'rgba(40,140,55,0.32)'
        : sem === 'scrap' ? 'rgba(200,130,40,0.32)' : null;
      if (!fill) return;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', r.x + 0.5); rect.setAttribute('y', r.y + 0.5);
      rect.setAttribute('width', r.w - 1); rect.setAttribute('height', r.h - 1);
      rect.setAttribute('fill', fill);
      overlay.appendChild(rect);
    });
  }
  drawCand(data.candidates.C, 'C');
  drawCand(data.candidates.D, 'D');
  drawCand(data.candidates.E, 'E');
}

function renderPhones() {
  const host = document.getElementById('phones');
  const z = data.mobilePortrait.proposedInitialZoom;
  host.innerHTML = '';
  ['C', 'D', 'E'].forEach((id) => {
    const c = data.candidates[id];
    if (!c) return;
    const mv = c.mobileViewport;
    const wrap = document.createElement('div');
    wrap.className = 'phone' + (focusId === id ? ' active' : '');
    wrap.dataset.id = id;

    const label = document.createElement('div');
    label.className = 'phone-label';
    label.textContent = `${id} · núcleo (${c.world.join(', ')})`;
    wrap.appendChild(label);

    const canvas = document.createElement('div');
    canvas.className = 'phone-canvas';
    // Escala el mundo para que 390 CSS-px = 390/zoom world-px → scale = zoom
    // En el teléfono simulamos: el div phone tiene aspect 390/844; transform scale(z) translate
    const img = document.createElement('img');
    img.src = 'assets/art/terrain/mapa-neni-1819x865-brownmatch-up2x.png';
    img.width = 1819; img.height = 865;
    img.draggable = false;
    img.style.cssText = 'position:absolute;left:0;top:0;width:1819px;height:865px;pointer-events:none;';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 1819 865');
    svg.style.cssText = 'position:absolute;left:0;top:0;width:1819px;height:865px;pointer-events:none;';

    // footprint + mark only for this candidate
    const g = zones.grid;
    const cell = g.cellPx;
    const col = COLORS[id];
    if (c.cell) {
      const [ccx, ccy] = c.cell;
      const ax = ccx - 2, ay = ccy - 2;
      const fp = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      fp.setAttribute('x', g.origin[0] + ax * cell);
      fp.setAttribute('y', g.origin[1] + ay * cell);
      fp.setAttribute('width', 5 * cell); fp.setAttribute('height', 4 * cell);
      fp.setAttribute('fill', col.fill); fp.setAttribute('stroke', col.stroke);
      fp.setAttribute('stroke-width', '2'); fp.setAttribute('stroke-dasharray', '5 3');
      svg.appendChild(fp);
    }
    const mark = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    mark.setAttribute('cx', c.world[0]); mark.setAttribute('cy', c.world[1]);
    mark.setAttribute('r', 6); mark.setAttribute('fill', col.mark);
    mark.setAttribute('stroke', '#fff'); mark.setAttribute('stroke-width', '2');
    svg.appendChild(mark);

    // Viewport frame in world coords (what phone sees)
    const visW = 390 / z, visH = 844 / z;
    const ox = c.world[0] - visW / 2, oy = c.world[1] - visH / 2;
    const frame = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    // not needed inside phone - the phone IS the viewport

    canvas.appendChild(img);
    canvas.appendChild(svg);
    // Center candidate: scale(z) then translate so candidate is at phone center
    // phone CSS size: use getBoundingClientRect after insert — approximate with wrap width
    wrap.appendChild(canvas);

    const meta = document.createElement('div');
    meta.className = 'phone-meta';
    meta.innerHTML = `z=${z} · visible ~${mv.visibleWorld[0]}×${mv.visibleWorld[1]} px mundo<br>` +
      `↑ encima ${mv.worldAbovePx}px · ↓ debajo ${mv.worldBelowPx}px<br>` +
      `vista Y ${mv.viewTop}…${mv.viewBottom}`;
    wrap.appendChild(meta);

    wrap.addEventListener('click', () => {
      focusId = id;
      focusOn(c.world[0], c.world[1], 1.25);
      renderPanel(); renderMap(); renderPhones();
    });
    host.appendChild(wrap);

    // Apply camera transform after layout
    requestAnimationFrame(() => {
      const pw = wrap.clientWidth || 360;
      const scale = (pw / 390) * z;
      const halfW = (390 / 2) / z;
      const halfH = (844 / 2) / z;
      // In phone CSS pixels: 1 world px = scale CSS px
      // translate so world point (wx,wy) maps to phone center
      const tx = -(c.world[0] - halfW);
      const ty = -(c.world[1] - halfH);
      canvas.style.transform = `scale(${scale}) translate(${tx}px,${ty}px)`;
      canvas.style.transformOrigin = '0 0';
    });
  });
}

async function boot() {
  const [zr, cr] = await Promise.all([
    fetch(ZONES_URL + '?v=' + Date.now()),
    fetch(CAND_URL + '?v=' + Date.now()),
  ]);
  zones = await zr.json();
  data = await cr.json();
  if (zones.schema !== 'neni-pilot-zone-map-v3') throw new Error('JSON zonas no canónico');
  renderPanel();
  renderMap();
  fitWorld();
  renderPhones();
}

document.getElementById('btn-zones').onclick = (e) => { showZones = !showZones; e.target.classList.toggle('on', showZones); renderMap(); };
document.getElementById('btn-halos').onclick = (e) => { showHalos = !showHalos; e.target.classList.toggle('on', showHalos); renderMap(); };
document.getElementById('btn-fps').onclick = (e) => { showFps = !showFps; e.target.classList.toggle('on', showFps); renderMap(); };
document.getElementById('btn-labels').onclick = (e) => { showLabels = !showLabels; e.target.classList.toggle('on', showLabels); renderMap(); };
document.getElementById('btn-fit').onclick = fitWorld;
document.getElementById('btn-c').onclick = () => { focusId = 'C'; focusOn(...data.candidates.C.world, 1.25); renderPanel(); renderMap(); renderPhones(); };
document.getElementById('btn-d').onclick = () => { focusId = 'D'; focusOn(...data.candidates.D.world, 1.25); renderPanel(); renderMap(); renderPhones(); };
document.getElementById('btn-e').onclick = () => { focusId = 'E'; focusOn(...data.candidates.E.world, 1.25); renderPanel(); renderMap(); renderPhones(); };

let drag = null, camD = null;
mapPane.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#panel')) return;
  drag = { x: e.clientX, y: e.clientY }; camD = { ...cam };
  mapPane.classList.add('grabbing');
});
mapPane.addEventListener('pointermove', (e) => {
  if (!drag) return;
  cam.x = camD.x - (e.clientX - drag.x) / cam.zoom;
  cam.y = camD.y - (e.clientY - drag.y) / cam.zoom;
  applyCamera();
});
function endP() { drag = null; mapPane.classList.remove('grabbing'); }
mapPane.addEventListener('pointerup', endP);
mapPane.addEventListener('pointercancel', endP);
mapPane.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.909;
  const rect = mapPane.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const ox = cam.x - mapPane.clientWidth / 2 / cam.zoom;
  const oy = cam.y - mapPane.clientHeight / 2 / cam.zoom;
  const wx = ox + mx / cam.zoom, wy = oy + my / cam.zoom;
  cam.zoom = Math.max(zoomMin(), Math.min(ZOOM_MAX, cam.zoom * factor));
  cam.x = wx - mx / cam.zoom + mapPane.clientWidth / 2 / cam.zoom;
  cam.y = wy - my / cam.zoom + mapPane.clientHeight / 2 / cam.zoom;
  applyCamera();
}, { passive: false });
window.addEventListener('resize', () => { applyCamera(); renderPhones(); });

boot().catch((e) => alert(e.message));
</script>
</body>
</html>
