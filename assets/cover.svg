<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zona Zero">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1210"/>
      <stop offset="55%" stop-color="#132018"/>
      <stop offset="100%" stop-color="#1a2c20"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffa0"/>
      <stop offset="100%" stop-color="#c6f56b"/>
    </linearGradient>
    <radialGradient id="fog" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7dffa0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="320" r="180" fill="url(#fog)"/>
  <!-- skyline -->
  <g fill="#0a100c" stroke="#3d5a45" stroke-width="3">
    <path d="M40 360 V220 H90 V360 Z"/>
    <path d="M100 360 V180 H160 V360 Z"/>
    <path d="M170 360 V240 H230 V360 Z"/>
    <path d="M240 360 V150 H310 V360 Z"/>
    <path d="M320 360 V210 H380 V360 Z"/>
    <path d="M390 360 V190 H470 V360 Z"/>
  </g>
  <!-- hazard mark -->
  <g transform="translate(256 250)">
    <circle r="78" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.9"/>
    <circle r="54" fill="none" stroke="#7dffa0" stroke-width="3" opacity="0.55"/>
    <text y="18" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="72" fill="#e7f2e9">0</text>
  </g>
  <text x="256" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="8" fill="#cfe9d4">ZONA ZERO</text>
</svg>
