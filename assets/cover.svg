<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zona Zero">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="42%" stop-color="#12100c"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="heat" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#6a4a28" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#3a2a18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="safe" cx="50%" cy="46%" r="38%">
      <stop offset="0%" stop-color="#4a9a62" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="45%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#8a6a38"/>
    </linearGradient>
    <linearGradient id="brassSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#6a5230"/>
    </linearGradient>
    <linearGradient id="fogLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2420" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0 0.28  0 0 0 0.12 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#heat)"/>
  <circle cx="256" cy="230" r="170" fill="url(#safe)"/>

  <g fill="#0a0908" opacity="0.92" filter="url(#grain)">
    <path d="M0 360 L28 360 L28 292 L52 292 L52 330 L78 330 L78 250 L110 250 L110 310 L138 310 L138 220 L168 220 L168 300 L198 300 L198 268 L230 268 L230 200 L270 200 L270 275 L300 275 L300 240 L338 240 L338 295 L372 295 L372 215 L410 215 L410 305 L448 305 L448 270 L480 270 L480 340 L512 340 L512 420 L0 420 Z"/>
  </g>
  <rect y="380" width="512" height="132" fill="url(#fogLine)"/>

  <g transform="translate(256 228)" filter="url(#grain)">
    <circle r="108" fill="none" stroke="rgba(196,165,116,0.16)" stroke-width="1.5"/>
    <circle r="96" fill="none" stroke="url(#brassSoft)" stroke-width="3.2" stroke-dasharray="22 9 6 9 16 9" opacity="0.9"/>
    <circle r="82" fill="none" stroke="rgba(212,176,106,0.28)" stroke-width="1.4"/>

    <g stroke="url(#brass)" stroke-width="3.4" stroke-linecap="square">
      <path d="M0 -104 V-88"/>
      <path d="M0 88 V104"/>
      <path d="M-104 0 H-88"/>
      <path d="M88 0 H104"/>
    </g>

    <path d="M0 -78 A78 78 0 0 1 70 -34" fill="none" stroke="url(#brass)" stroke-width="11" opacity="0.92"/>
    <path d="M78 -10 A78 78 0 0 1 0 78" fill="none" stroke="url(#brass)" stroke-width="11" opacity="0.72"/>
    <path d="M-28 74 A78 78 0 0 1 -78 0" fill="none" stroke="url(#brass)" stroke-width="11" opacity="0.88"/>
    <path d="M-74 -28 A78 78 0 0 1 -18 -76" fill="none" stroke="url(#brass)" stroke-width="11" opacity="0.7"/>

    <path d="M62 -28 L78 -48" stroke="#8a4030" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <path d="M66 -22 L74 -12" stroke="#0a0908" stroke-width="6" opacity="0.45"/>

    <circle r="46" fill="none" stroke="url(#brass)" stroke-width="14"/>
    <circle r="30" fill="#0e0c0a" stroke="rgba(74,154,98,0.4)" stroke-width="2"/>

    <path d="M0 -58 L12 -40 H-12 Z" fill="url(#brass)"/>
  </g>

  <text x="256" y="398" text-anchor="middle"
        font-family="Rajdhani, 'Arial Narrow', Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="10"
        fill="#e8e0d4">ZONA ZERO</text>
  <text x="256" y="430" text-anchor="middle"
        font-family="IBM Plex Sans, Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="6"
        fill="#c4a574" opacity="0.85">REFUGIO · SUPERVIVENCIA</text>
</svg>
