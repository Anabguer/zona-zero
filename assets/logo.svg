<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Zona Zero">
  <defs>
    <linearGradient id="zzPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1814"/>
      <stop offset="45%" stop-color="#12100c"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="zzBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="40%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#8a6a38"/>
    </linearGradient>
    <linearGradient id="zzBrassSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#6a5230"/>
    </linearGradient>
    <radialGradient id="zzSafe" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#4a9a62" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#2a4030" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="zzGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0.16 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="22" fill="url(#zzPlate)"/>
  <rect x="5" y="5" width="118" height="118" rx="18" fill="none" stroke="rgba(196,165,116,0.2)" stroke-width="1.25"/>
  <circle cx="64" cy="64" r="48" fill="url(#zzSafe)"/>

  <g filter="url(#zzGrain)">
    <!-- outer dashed perimeter -->
    <circle cx="64" cy="64" r="46" fill="none" stroke="url(#zzBrassSoft)" stroke-width="2.6" stroke-dasharray="12 5 3 5 9 5" opacity="0.9"/>
    <circle cx="64" cy="64" r="39.5" fill="none" stroke="rgba(212,176,106,0.28)" stroke-width="1"/>

    <!-- cardinal ticks -->
    <g stroke="url(#zzBrass)" stroke-width="2.4" stroke-linecap="square">
      <path d="M64 16 V25"/>
      <path d="M64 103 V112"/>
      <path d="M16 64 H25"/>
      <path d="M103 64 H112"/>
    </g>

    <!-- vault hatch arcs -->
    <path d="M64 22.5 A41.5 41.5 0 0 1 100 48" fill="none" stroke="url(#zzBrass)" stroke-width="6" opacity="0.92"/>
    <path d="M103 72 A41.5 41.5 0 0 1 64 105.5" fill="none" stroke="url(#zzBrass)" stroke-width="6" opacity="0.7"/>
    <path d="M48 104 A41.5 41.5 0 0 1 22.5 64" fill="none" stroke="url(#zzBrass)" stroke-width="6" opacity="0.88"/>
    <path d="M24 50 A41.5 41.5 0 0 1 56 23" fill="none" stroke="url(#zzBrass)" stroke-width="6" opacity="0.68"/>

    <!-- rust crack -->
    <path d="M98 46 L108 34" stroke="#8a4030" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    <path d="M99 48 L105 42" stroke="#0a0908" stroke-width="5" opacity="0.5"/>

    <!-- ZERO -->
    <circle cx="64" cy="64" r="23" fill="none" stroke="url(#zzBrass)" stroke-width="8"/>
    <circle cx="64" cy="64" r="14.5" fill="#0e0c0a" stroke="rgba(74,154,98,0.42)" stroke-width="1.4"/>

    <!-- north marker -->
    <path d="M64 34 L71 45 H57 Z" fill="url(#zzBrass)"/>
  </g>

  <path d="M20 110 Q44 103 64 111 T108 108" fill="none" stroke="#8a4030" stroke-width="1.1" opacity="0.32"/>
</svg>
