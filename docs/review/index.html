<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revisión visual · Zona Zero 1.2.5</title>
  <style>
    :root { color-scheme: dark; --bg:#12100e; --card:#1a1612; --line:#3a342c; --text:#e8e0d4; --muted:#9a9080; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.4; padding:1.25rem 1rem 2.5rem; }
    header { max-width:1100px; margin:0 auto 1.5rem; }
    h1 { font-size:1.35rem; font-weight:650; margin:0 0 0.35rem; }
    header p { margin:0; color:var(--muted); font-size:0.92rem; }
    .gallery { max-width:1100px; margin:0 auto; display:grid; gap:1.25rem; grid-template-columns:1fr; }
    @media (min-width:720px) { .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    a.shot { display:block; color:inherit; text-decoration:none; }
    img { display:block; width:100%; height:auto; background:#0a0908; }
    figcaption { padding:0.65rem 0.85rem 0.8rem; font-size:0.95rem; font-weight:600; border-top:1px solid var(--line); }
    figcaption span { display:block; margin-top:0.15rem; font-size:0.78rem; font-weight:400; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Revisión visual · Zona Zero 1.2.5</h1>
    <p>Capturas de la revisión actual (UX + representación del mundo). Se sustituyen en cada entrega.</p>
  </header>
  <main class="gallery">
    <figure>
      <a class="shot" href="dia1.png" target="_blank" rel="noopener">
        <img src="dia1.png" alt="Día 1" loading="lazy" />
      </a>
      <figcaption>Día 1<span>dia1.png · colonia inicial</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="mobile.png" target="_blank" rel="noopener">
        <img src="mobile.png" alt="Móvil" loading="lazy" />
      </a>
      <figcaption>Móvil<span>mobile.png · HUD denso + mundo</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="poblacion.png" target="_blank" rel="noopener">
        <img src="poblacion.png" alt="Población" loading="lazy" />
      </a>
      <figcaption>Población<span>poblacion.png · impacto esperado por asignación</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="construir.png" target="_blank" rel="noopener">
        <img src="construir.png" alt="Construcción" loading="lazy" />
      </a>
      <figcaption>Construcción<span>construir.png · catálogo visual</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="explorador.png" target="_blank" rel="noopener">
        <img src="explorador.png" alt="Explorador" loading="lazy" />
      </a>
      <figcaption>Explorador<span>explorador.png · retrato · nivel · XP · skills</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="mapa-explorando.png" target="_blank" rel="noopener">
        <img src="mapa-explorando.png" alt="Mapa explorando" loading="lazy" />
      </a>
      <figcaption>Mapa explorando<span>mapa-explorando.png · destinos resaltados</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="colonia-media.png" target="_blank" rel="noopener">
        <img src="colonia-media.png" alt="Colonia media" loading="lazy" />
      </a>
      <figcaption>Colonia media<span>colonia-media.png · día ~18 · más edificios/luces</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="colonia-avanzada.png" target="_blank" rel="noopener">
        <img src="colonia-avanzada.png" alt="Colonia avanzada" loading="lazy" />
      </a>
      <figcaption>Colonia avanzada<span>colonia-avanzada.png · día ~40 · densamente ocupada</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="gameplay.png" target="_blank" rel="noopener">
        <img src="gameplay.png" alt="Gameplay" loading="lazy" />
      </a>
      <figcaption>Gameplay<span>gameplay.png · colonia avanzada en móvil</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="desktop-panoramico.png" target="_blank" rel="noopener">
        <img src="desktop-panoramico.png" alt="Desktop panorámico" loading="lazy" />
      </a>
      <figcaption>Desktop panorámico<span>desktop-panoramico.png · ciudad amplia 1440×900</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="desktop.png" target="_blank" rel="noopener">
        <img src="desktop.png" alt="Escritorio" loading="lazy" />
      </a>
      <figcaption>Escritorio<span>desktop.png · mismo estado</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="desktop-poblacion.png" target="_blank" rel="noopener">
        <img src="desktop-poblacion.png" alt="Escritorio · Población" loading="lazy" />
      </a>
      <figcaption>Escritorio · Población<span>desktop-poblacion.png · panel flotante</span></figcaption>
    </figure>
  </main>
</body>
</html>
