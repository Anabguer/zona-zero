<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revisión visual · Zona Zero 1.3</title>
  <style>
    :root { color-scheme: dark; --bg:#12100e; --card:#1a1612; --line:#3a342c; --text:#e8e0d4; --muted:#9a9080; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); padding:1.25rem 1rem 2.5rem; }
    header { max-width:1100px; margin:0 auto 1.5rem; }
    h1 { font-size:1.35rem; margin:0 0 0.35rem; }
    header p { margin:0; color:var(--muted); font-size:0.92rem; }
    .gallery { max-width:1100px; margin:0 auto; display:grid; gap:1.25rem; grid-template-columns:1fr; }
    @media (min-width:720px) { .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    img { display:block; width:100%; height:auto; background:#0a0908; }
    figcaption { padding:0.65rem 0.85rem 0.8rem; font-weight:600; border-top:1px solid var(--line); }
    figcaption span { display:block; margin-top:0.15rem; font-size:0.78rem; font-weight:400; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Revisión visual · Zona Zero 1.3</h1>
    <p>UX mundo-primero. Se sustituyen en cada entrega.</p>
  </header>
  <main class="gallery">
    <figure>
      <a class="shot" href="dia1.png" target="_blank" rel="noopener">
        <img src="dia1.png" alt="Día 1" loading="lazy" />
      </a>
      <figcaption>Día 1<span>dia1.png · asentamiento inicial</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="mobile.png" target="_blank" rel="noopener">
        <img src="mobile.png" alt="Móvil" loading="lazy" />
      </a>
      <figcaption>Móvil<span>mobile.png · mundo full-bleed</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="poblacion.png" target="_blank" rel="noopener">
        <img src="poblacion.png" alt="Población" loading="lazy" />
      </a>
      <figcaption>Población<span>poblacion.png · herramienta avanzada</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="construir.png" target="_blank" rel="noopener">
        <img src="construir.png" alt="Construir" loading="lazy" />
      </a>
      <figcaption>Construir<span>construir.png · catálogo compacto con arte</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="explorador.png" target="_blank" rel="noopener">
        <img src="explorador.png" alt="Explorador" loading="lazy" />
      </a>
      <figcaption>Explorador<span>explorador.png · retrato real</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="edificio-seleccionado.png" target="_blank" rel="noopener">
        <img src="edificio-seleccionado.png" alt="Edificio seleccionado" loading="lazy" />
      </a>
      <figcaption>Edificio seleccionado<span>edificio-seleccionado.png · ficha huerto + trabajadores</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="exploracion-zona.png" target="_blank" rel="noopener">
        <img src="exploracion-zona.png" alt="Exploración zona" loading="lazy" />
      </a>
      <figcaption>Exploración zona<span>exploracion-zona.png · ficha contextual Explorar</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="dia15.png" target="_blank" rel="noopener">
        <img src="dia15.png" alt="Día 15" loading="lazy" />
      </a>
      <figcaption>Día 15<span>dia15.png · colonia media</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="gameplay.png" target="_blank" rel="noopener">
        <img src="gameplay.png" alt="Gameplay" loading="lazy" />
      </a>
      <figcaption>Gameplay<span>gameplay.png · colonia en juego</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="dia30.png" target="_blank" rel="noopener">
        <img src="dia30.png" alt="Día 30" loading="lazy" />
      </a>
      <figcaption>Día 30<span>dia30.png · colonia avanzada</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="desktop.png" target="_blank" rel="noopener">
        <img src="desktop.png" alt="Escritorio" loading="lazy" />
      </a>
      <figcaption>Escritorio<span>desktop.png · viewport lleno</span></figcaption>
    </figure>
    <figure>
      <a class="shot" href="desktop-poblacion.png" target="_blank" rel="noopener">
        <img src="desktop-poblacion.png" alt="Escritorio · Población" loading="lazy" />
      </a>
      <figcaption>Escritorio · Población<span>desktop-poblacion.png · panel lateral</span></figcaption>
    </figure>
  </main>
</body>
</html>
