<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor de Mapa — Zona Zero</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1510;
    color: #e8d8b0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── TOOLBAR ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #251e14;
    border-bottom: 2px solid #5a3e1b;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #toolbar h1 { font-size: 14px; color: #c9a96e; margin-right: 10px; white-space: nowrap; }

  .sep { width: 1px; height: 28px; background: #5a3e1b; margin: 0 4px; }

  .tool-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all .15s;
  }
  .tool-btn:hover { filter: brightness(1.2); }
  .tool-btn.active { border-color: #fff; }

  #btn-forest  { background: #1e5c1e; color: #9edb80; }
  #btn-build   { background: #4a7a2a; color: #d4f09a; }
  #btn-erase   { background: #4a2020; color: #f0a0a0; }
  #btn-place   { background: #2a3a6a; color: #a0c0f0; }

  #btn-clear   { background: #333; color: #aaa; font-size: 12px; padding: 5px 10px; }
  #btn-export  { background: #5a3e1b; color: #f0d090; font-size: 12px; padding: 5px 10px; }

  #status { font-size: 12px; color: #a08060; margin-left: auto; }

  /* ── MAIN LAYOUT ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 180px;
    flex-shrink: 0;
    background: #1e1710;
    border-right: 2px solid #5a3e1b;
    overflow-y: auto;
    padding: 10px 8px;
  }

  #sidebar h2 { font-size: 12px; color: #a08060; text-transform: uppercase;
                letter-spacing: 1px; margin-bottom: 8px; text-align: center; }

  .building-card {
    background: #2a2015;
    border: 2px solid #4a3010;
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .building-card:hover { border-color: #c9a96e; background: #352818; }
  .building-card.selected { border-color: #f0d060; background: #3a3010; }

  .building-card .bname { font-size: 13px; font-weight: 700; color: #e8c87a; }
  .building-card .bfp   { font-size: 11px; color: #a09070; margin-top: 2px; }
  .building-card .bpop  { font-size: 11px; color: #80b060; }

  .cat-label {
    font-size: 10px;
    color: #806040;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 10px 0 4px;
    padding-left: 4px;
    border-left: 2px solid #5a3e1b;
  }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #111;
  }

  #canvas-wrap canvas {
    display: block;
    cursor: crosshair;
  }

  /* Floating placed-building tooltip */
  #tooltip {
    position: fixed;
    background: rgba(0,0,0,.85);
    color: #e8d8b0;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 100;
    border: 1px solid #5a3e1b;
  }

  /* ── LEGEND ── */
  #legend {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 5px 14px;
    background: #1e1710;
    border-top: 1px solid #3a2810;
    flex-shrink: 0;
    font-size: 11px;
    flex-wrap: wrap;
  }
  .leg { display: flex; align-items: center; gap: 5px; }
  .leg-box { width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(255,255,255,.2); }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <h1>🗺 Editor Zona Zero</h1>
  <div class="sep"></div>

  <button class="tool-btn active" id="btn-forest"  onclick="setTool('forest')">🌲 Bosque</button>
  <button class="tool-btn"        id="btn-build"   onclick="setTool('build')">🏗 Construible</button>
  <button class="tool-btn"        id="btn-erase"   onclick="setTool('erase')">✖ Borrar celda</button>
  <button class="tool-btn"        id="btn-place"   onclick="setTool('place')">🏠 Colocar edificio</button>

  <div class="sep"></div>
  <button class="tool-btn" id="btn-clear"  onclick="clearAll()" style="background:#3a2020;color:#f08080">🗑 Limpiar todo</button>
  <button class="tool-btn" id="btn-export" onclick="exportJSON()">💾 Exportar JSON</button>

  <div class="sep"></div>
  <label style="font-size:12px;color:#a08060">
    Grid:
    <input id="inp-cols" type="number" value="26" min="4" max="80" style="width:46px;background:#1a1510;color:#e8d8b0;border:1px solid #5a3e1b;border-radius:3px;padding:2px 4px">
    ×
    <input id="inp-rows" type="number" value="18" min="4" max="60" style="width:46px;background:#1a1510;color:#e8d8b0;border:1px solid #5a3e1b;border-radius:3px;padding:2px 4px">
    <button onclick="rebuildGrid()" style="margin-left:4px;padding:3px 8px;background:#3a2810;color:#c9a96e;border:1px solid #5a3e1b;border-radius:4px;cursor:pointer;font-size:12px">Aplicar</button>
  </label>

  <span id="status">Herramienta: Bosque</span>
</div>

<!-- MAIN -->
<div id="main">
  <!-- SIDEBAR edificios -->
  <div id="sidebar">
    <h2>Edificios</h2>
    <div id="building-list"></div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <canvas id="map"></canvas>
  </div>
</div>

<!-- LEGEND -->
<div id="legend">
  <strong style="color:#a08060">Leyenda:</strong>
  <div class="leg"><div class="leg-box" style="background:rgba(20,80,20,.55);border-color:#4a9a4a"></div> Bosque</div>
  <div class="leg"><div class="leg-box" style="background:rgba(70,140,30,.45);border-color:#90c040"></div> Construible</div>
  <div class="leg"><div class="leg-box" style="background:rgba(50,100,200,.5);border-color:#6090e0"></div> Edificio colocado</div>
  <span style="color:#605040;margin-left:auto">Click = pintar celda | Arrastrar edificio para moverlo</span>
</div>

<div id="tooltip"></div>

<script>
// ═══════════════════════════════════════════════════════
// CATÁLOGO DE EDIFICIOS
// ═══════════════════════════════════════════════════════
const BUILDINGS = [
  // Vivienda
  { id:'house',      name:'Casa',             fp:[4,2], pop:6,  cat:'Vivienda',     color:'#3a6ab0' },
  { id:'hq',         name:'Refugio Central',  fp:[5,4], pop:0,  cat:'Vivienda',     color:'#8a3ab0' },
  { id:'shelter',    name:'Refugio 3x2',      fp:[3,2], pop:4,  cat:'Vivienda',     color:'#5a5ab0' },

  // Servicios
  { id:'kitchen',    name:'Cocina',           fp:[4,2], pop:0,  cat:'Servicios',    color:'#b07a2a' },
  { id:'infirmary',  name:'Enfermería',       fp:[4,3], pop:0,  cat:'Servicios',    color:'#b04040' },
  { id:'medkit',     name:'Botiquín',         fp:[2,2], pop:0,  cat:'Servicios',    color:'#b06060' },
  { id:'radio',      name:'Radio',            fp:[3,2], pop:0,  cat:'Servicios',    color:'#407080' },

  // Producción
  { id:'workshop',   name:'Taller',           fp:[5,2], pop:0,  cat:'Producción',   color:'#806020' },
  { id:'sawmill',    name:'Aserradero',       fp:[5,3], pop:0,  cat:'Producción',   color:'#704818' },
  { id:'scrapyard',  name:'Chatarrería',      fp:[5,3], pop:0,  cat:'Producción',   color:'#606060' },
  { id:'greenhouse', name:'Invernadero',      fp:[4,3], pop:0,  cat:'Producción',   color:'#306830' },
  { id:'farm',       name:'Huerto',           fp:[3,2], pop:0,  cat:'Producción',   color:'#407030' },

  // Infraestructura
  { id:'storage',    name:'Almacén',          fp:[5,3], pop:0,  cat:'Infra',        color:'#705838' },
  { id:'cistern',    name:'Cisterna',         fp:[2,2], pop:0,  cat:'Infra',        color:'#306080' },
  { id:'well',       name:'Pozo',             fp:[2,1], pop:0,  cat:'Infra',        color:'#284860' },
];

// ═══════════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════════
let COLS = 26, ROWS = 18;
let cellW, cellH;
let MAP_W, MAP_H;

// grid[r][c] = null | 'forest' | 'build'
let grid = [];

// placed = [{id, bid, col, row, w, h, name, color, x, y}]
let placed = [];

// tool: 'forest' | 'build' | 'erase' | 'place'
let tool = 'forest';
let selectedBuilding = null;

// drag state
let dragging = null;         // edificio que se arrastra
let dragOffX = 0, dragOffY = 0;

// paint state (para pintar celdas con drag)
let painting = false;

let bgImage = null;
let nextId = 1;

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  buildSidebar();
  loadBackground('mapa-chatgpt.png');
});

function loadBackground(src) {
  const img = new Image();
  img.onload = () => {
    bgImage = img;
    MAP_W = img.naturalWidth;
    MAP_H = img.naturalHeight;
    rebuildGrid();
  };
  img.onerror = () => {
    MAP_W = 1024; MAP_H = 680;
    rebuildGrid();
  };
  img.src = src;
}

function rebuildGrid() {
  COLS = parseInt(document.getElementById('inp-cols').value) || 26;
  ROWS = parseInt(document.getElementById('inp-rows').value) || 18;
  cellW = MAP_W / COLS;
  cellH = MAP_H / ROWS;
  canvas.width  = MAP_W;
  canvas.height = MAP_H;
  // Reset grid manteniendo celdas que aún quepan
  const newGrid = Array.from({length: ROWS}, (_, r) =>
    Array.from({length: COLS}, (_, c) => (grid[r] && grid[r][c]) || null)
  );
  grid = newGrid;
  // Eliminar placed que ya no caben
  placed = placed.filter(p => p.col + p.w <= COLS && p.row + p.h <= ROWS);
  draw();
}

// ═══════════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════════
function buildSidebar() {
  const el = document.getElementById('building-list');
  let lastCat = '';
  BUILDINGS.forEach(b => {
    if (b.cat !== lastCat) {
      lastCat = b.cat;
      const lbl = document.createElement('div');
      lbl.className = 'cat-label';
      lbl.textContent = b.cat;
      el.appendChild(lbl);
    }
    const card = document.createElement('div');
    card.className = 'building-card';
    card.dataset.bid = b.id;
    card.innerHTML = `
      <div class="bname">${b.name}</div>
      <div class="bfp">${b.fp[0]}×${b.fp[1]} celdas</div>
      ${b.pop ? `<div class="bpop">👥 ${b.pop} hab.</div>` : ''}
    `;
    card.addEventListener('click', () => selectBuilding(b.id));
    el.appendChild(card);
  });
}

function selectBuilding(bid) {
  selectedBuilding = BUILDINGS.find(b => b.id === bid);
  document.querySelectorAll('.building-card').forEach(c =>
    c.classList.toggle('selected', c.dataset.bid === bid)
  );
  setTool('place');
}

// ═══════════════════════════════════════════════════════
// HERRAMIENTAS
// ═══════════════════════════════════════════════════════
function setTool(t) {
  tool = t;
  ['forest','build','erase','place'].forEach(id => {
    const btn = document.getElementById('btn-' + id);
    if (btn) btn.classList.toggle('active', id === t);
  });
  const labels = { forest:'Bosque', build:'Construible', erase:'Borrar celda', place:'Colocar edificio' };
  document.getElementById('status').textContent = 'Herramienta: ' + labels[t] +
    (t === 'place' && selectedBuilding ? ` → ${selectedBuilding.name}` : '');
  canvas.style.cursor = t === 'place' ? 'copy' : 'crosshair';
}

// ═══════════════════════════════════════════════════════
// DIBUJO
// ═══════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  // Fondo
  if (bgImage) ctx.drawImage(bgImage, 0, 0, MAP_W, MAP_H);
  else { ctx.fillStyle = '#3a2810'; ctx.fillRect(0, 0, MAP_W, MAP_H); }

  // Celdas pintadas
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      if (!v) continue;
      const x = c * cellW, y = r * cellH;
      ctx.fillStyle = v === 'forest' ? 'rgba(20,80,20,.55)' : 'rgba(70,140,30,.40)';
      ctx.fillRect(x, y, cellW, cellH);
      ctx.strokeStyle = v === 'forest' ? '#3a8a3a' : '#70b030';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, cellW - 1, cellH - 1);
    }
  }

  // Grid lines (tenues)
  ctx.strokeStyle = 'rgba(200,160,80,.18)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * cellW, 0); ctx.lineTo(c * cellW, MAP_H); ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * cellH); ctx.lineTo(MAP_W, r * cellH); ctx.stroke();
  }

  // Edificios colocados
  placed.forEach(p => drawBuilding(p));
}

function drawBuilding(p) {
  const x = p.col * cellW, y = p.row * cellH;
  const w = p.w * cellW,   h = p.h * cellH;

  // Override con posición de arrastre si aplica
  const px = (dragging && dragging.p === p) ? dragging.cx - dragOffX : x;
  const py = (dragging && dragging.p === p) ? dragging.cy - dragOffY : y;

  ctx.fillStyle = hexToRgba(p.color, 0.55);
  ctx.fillRect(px, py, w, h);
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2;
  ctx.strokeRect(px + 1, py + 1, w - 2, h - 2);

  // Label
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(9, Math.min(13, cellH * 0.38))}px Segoe UI`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 4;
  ctx.fillText(p.name, px + w / 2, py + h / 2);
  ctx.shadowBlur = 0;

  // Footprint label
  ctx.font = `${Math.max(8, Math.min(10, cellH * 0.28))}px Segoe UI`;
  ctx.fillStyle = 'rgba(255,255,200,.75)';
  ctx.fillText(`${p.w}×${p.h}`, px + w / 2, py + h / 2 + Math.min(14, cellH * 0.38));
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ═══════════════════════════════════════════════════════
// EVENTOS DE CANVAS
// ═══════════════════════════════════════════════════════
function canvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = MAP_W / rect.width;
  const scaleY = MAP_H / rect.height;
  return [(e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY];
}

function cellAt(cx, cy) {
  return [Math.floor(cx / cellW), Math.floor(cy / cellH)];
}

function buildingAt(cx, cy) {
  // Buscar en orden inverso (último colocado = encima)
  for (let i = placed.length - 1; i >= 0; i--) {
    const p = placed[i];
    const bx = p.col * cellW, by = p.row * cellH;
    const bw = p.w * cellW,   bh = p.h * cellH;
    if (cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh) return p;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const [cx, cy] = canvasXY(e);

  if (tool === 'place' && selectedBuilding) {
    // Colocar edificio
    const [c, r] = cellAt(cx, cy);
    const p = {
      id: nextId++,
      bid: selectedBuilding.id,
      name: selectedBuilding.name,
      col: Math.max(0, Math.min(COLS - selectedBuilding.fp[0], c)),
      row: Math.max(0, Math.min(ROWS - selectedBuilding.fp[1], r)),
      w: selectedBuilding.fp[0],
      h: selectedBuilding.fp[1],
      color: selectedBuilding.color,
    };
    placed.push(p);
    draw();
    return;
  }

  // ¿Hay un edificio en este punto? → arrastrar
  const hit = buildingAt(cx, cy);
  if (hit) {
    dragging = { p: hit, cx, cy };
    dragOffX = cx - hit.col * cellW;
    dragOffY = cy - hit.row * cellH;
    return;
  }

  // Pintar celda
  painting = true;
  paintCell(cx, cy);
});

canvas.addEventListener('mousemove', e => {
  const [cx, cy] = canvasXY(e);

  if (dragging) {
    dragging.cx = cx; dragging.cy = cy;
    draw();
    return;
  }
  if (painting) paintCell(cx, cy);

  // Tooltip sobre edificio
  const hit = buildingAt(cx, cy);
  const tip = document.getElementById('tooltip');
  if (hit && tool !== 'place') {
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top  = (e.clientY + 12) + 'px';
    const binfo = BUILDINGS.find(b => b.id === hit.bid);
    tip.textContent = `${hit.name}  ${hit.w}×${hit.h}` + (binfo?.pop ? `  👥${binfo.pop}` : '');
  } else {
    tip.style.display = 'none';
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragging) {
    const [cx, cy] = canvasXY(e);
    const [c, r] = cellAt(cx - dragOffX + cellW / 2, cy - dragOffY + cellH / 2);
    dragging.p.col = Math.max(0, Math.min(COLS - dragging.p.w, c));
    dragging.p.row = Math.max(0, Math.min(ROWS - dragging.p.h, r));
    dragging = null;
    draw();
  }
  painting = false;
});

canvas.addEventListener('mouseleave', () => {
  painting = false;
  document.getElementById('tooltip').style.display = 'none';
});

// Doble click → eliminar edificio
canvas.addEventListener('dblclick', e => {
  const [cx, cy] = canvasXY(e);
  const hit = buildingAt(cx, cy);
  if (hit) {
    placed = placed.filter(p => p !== hit);
    draw();
  }
});

// Click derecho → eliminar edificio
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const [cx, cy] = canvasXY(e);
  const hit = buildingAt(cx, cy);
  if (hit) { placed = placed.filter(p => p !== hit); draw(); }
});

function paintCell(cx, cy) {
  const [c, r] = cellAt(cx, cy);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  if (tool === 'forest')  grid[r][c] = 'forest';
  if (tool === 'build')   grid[r][c] = 'build';
  if (tool === 'erase')   grid[r][c] = null;
  draw();
}

// ═══════════════════════════════════════════════════════
// ACCIONES
// ═══════════════════════════════════════════════════════
function clearAll() {
  if (!confirm('¿Borrar todo el mapa?')) return;
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  placed = [];
  draw();
}

function exportJSON() {
  const data = {
    cols: COLS, rows: ROWS,
    grid: grid.map(row => row.map(v => v || '')),
    buildings: placed.map(p => ({ bid:p.bid, name:p.name, col:p.col, row:p.row, w:p.w, h:p.h }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mapa-zona-zero.json';
  a.click();
}

// ═══════════════════════════════════════════════════════
// TECLADO
// ═══════════════════════════════════════════════════════
window.addEventListener('keydown', e => {
  if (e.key === '1') setTool('forest');
  if (e.key === '2') setTool('build');
  if (e.key === '3') setTool('erase');
  if (e.key === '4') setTool('place');
  if (e.key === 'Escape') { selectedBuilding = null; setTool('forest'); }
});
</script>
</body>
</html>
