<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Zona Zero · harness 1.2</title>
  <link rel="stylesheet" href="../css/game.css?v=12" />
  <link rel="stylesheet" href="../css/world.css?v=12" />
  <script type="importmap">
  {
    "imports": {
      "/js/api.js": "/dev/api-mock.js",
      "../js/api.js": "./api-mock.js"
    }
  }
  </script>
</head>
<body class="zz-body zz-body--play zz-body--world">
  <div id="zz-boot" class="zz-boot">Preparando…</div>
  <div id="zz-app" class="zz-world" hidden>
    <header class="zz-world-top">
      <a class="zz-back" href="#">Slots</a>
      <div class="zz-world-top__mid">
        <strong id="zz-colony">Harness</strong>
        <span id="zz-day-label">Día 1</span>
      </div>
      <div class="zz-world-top__actions">
        <button type="button" class="zz-btn zz-btn--compact zz-sound" id="zz-sound">Sonido</button>
        <button type="button" class="zz-btn zz-btn--compact" id="zz-save">Guardar</button>
        <span id="zz-save-state" class="zz-save-state"></span>
      </div>
    </header>
    <p class="zz-coach" id="zz-coach" hidden>
      <span id="zz-coach-text"></span>
      <button type="button" id="zz-coach-dismiss">×</button>
    </p>
    <section class="zz-chip-hud">
      <button type="button" class="zz-chip-hud__pop" id="zz-open-pop">
        <span class="zz-ico zz-ico--pop"></span>
        <strong id="zz-pop">0/0</strong>
      </button>
      <ul class="zz-chip-hud__res" id="zz-resources"></ul>
      <div class="zz-chip-hud__meta">
        <span id="zz-era" class="zz-chip-hud__era">—</span>
        <span id="zz-weather" class="zz-weather" data-weather="clear">—</span>
        <span class="zz-chip-hud__m"><i></i><strong id="zz-stability">0</strong></span>
        <span class="zz-chip-hud__m zz-chip-hud__m--threat"><i></i><strong id="zz-threat">0</strong></span>
        <span class="zz-chip-hud__m zz-chip-hud__m--def"><i></i><strong id="zz-defense">0</strong></span>
      </div>
    </section>
    <main class="zz-world-stage">
      <div class="zz-world-map-wrap">
        <svg id="zz-map" class="zz-map" viewBox="0 0 100 100"></svg>
      </div>
      <div class="zz-explorer-rail" id="zz-explorer-rail"></div>
    </main>
    <aside id="zz-sheet" class="zz-sheet" hidden>
      <div class="zz-sheet__handle"></div>
      <button type="button" class="zz-sheet__close" id="zz-sheet-close">×</button>
      <div id="zz-sheet-body" class="zz-sheet__body"></div>
    </aside>
    <div id="zz-pulse-layer" class="zz-pulse-layer"></div>
    <div id="zz-event-card" class="zz-event-card" hidden></div>
    <div id="zz-attack-card" class="zz-attack-card" hidden></div>
    <footer class="zz-world-dock">
      <button type="button" class="zz-btn zz-btn--ghost" id="zz-open-build">Construir</button>
      <button type="button" class="zz-btn zz-btn--primary zz-btn--wide" id="zz-advance">Avanzar día</button>
      <button type="button" class="zz-btn zz-btn--ghost" id="zz-open-more">Más</button>
    </footer>
    <div id="zz-defeat" class="zz-defeat" hidden>
      <div class="zz-defeat__card"><h2>Derrota</h2><p id="zz-defeat-msg"></p></div>
    </div>
    <div id="zz-victory" class="zz-victory" hidden>
      <div class="zz-victory__card"><h2>Victoria</h2><button type="button" class="zz-btn" id="zz-endless">Endless</button></div>
    </div>
    <div id="zz-choice-modal" class="zz-choice" hidden>
      <div class="zz-choice__card">
        <div class="zz-choice__head" id="zz-choice-head"></div>
        <h2 id="zz-choice-title">Decisión</h2>
        <p id="zz-choice-text"></p>
        <div id="zz-choice-actions" class="zz-choice__actions"></div>
      </div>
    </div>
  </div>
  <div id="zz-toast" class="zz-toast" hidden></div>
  <script type="module">
    import { bootGame } from '../js/main.js?v=12';
    window.__zzReady = bootGame({ slot: 1, mode: 'new', name: 'Harness' })
      .then(() => { window.__zzOk = true; })
      .catch((e) => { window.__zzOk = false; window.__zzErr = String(e && e.message ? e.message : e); throw e; });
  </script>
</body>
</html>
