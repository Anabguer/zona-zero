<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zona Zero · hub empty</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/game.css?v=43" />
  <link rel="stylesheet" href="../css/hub.css?v=43" />
  <script type="importmap">
  {
    "imports": {
      "/js/api.js": "/dev/api-mock.js",
      "../js/api.js": "./api-mock.js",
      "./api.js": "./api-mock.js"
    }
  }
  </script>
</head>
<body class="zz-body zz-body--hub">
  <div id="zz-hub-boot" class="zz-boot">Cargando…</div>
  <div id="zz-hub" class="zz-hub" hidden>
    <div class="zz-hub__atmosphere" aria-hidden="true"></div>
    <header class="zz-hub__top">
      <a class="zz-back" href="#">← Juegos</a>
      <p class="zz-user">Hola, <strong id="zz-user">Tester</strong></p>
    </header>
    <main class="zz-hub__hero">
      <h1 class="zz-hub__brand">
        <img
          class="zz-hub__logo"
          src="../assets/logo.svg"
          width="200"
          height="200"
          alt="Zona Zero"
          onerror="this.onerror=null;this.src='../assets/cover.svg'"
        />
      </h1>
      <div class="zz-hub__actions" id="zz-hub-actions" aria-label="Empezar"></div>
    </main>
  </div>
  <script type="module">
    import { bootHub } from '../js/main.js?v=43';
    bootHub({
      demoEmpty: true,
      playUrl: './harness-zz.html',
    }).then(() => {
      window.__zzHubOk = true;
    }).catch((e) => {
      window.__zzHubErr = String(e?.message || e);
      console.error(e);
    });
  </script>
</body>
</html>
